[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dealflow"
version = "0.1.0"
description = "A sales agent framework built on CAMEL"
authors = [
    {name = "Rishabh Sharma", email = "rishabh.sharma@spinutech.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "camel-ai[all]==0.2.45",
    "python-dotenv",
    "requests"
]

[project.urls]
"Bug Tracker" = "https://github.com/Spinutech-Dev/DealFlow/issues"
"Documentation" = "https://github.com/Spinutech-Dev/DealFlow"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "mypy",
    "pytest",
    "pytest-cov"
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]