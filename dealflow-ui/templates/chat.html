{% extends "base.html" %}

{% block title %}Chat with Your Sales Agent{% endblock %}

{% block content %}
<div class="chat-container" id="chat-container">
    <div class="chat-header">
        <div class="agent-info">
            <h2>{{ agent_details.salesperson_name }}</h2>
            <p>{{ agent_details.salesperson_role }} at {{ agent_details.company_name }}</p>
        </div>
        <button id="reset-button" class="btn">Reset Agent</button>
    </div>
    
    <div class="messages-container" id="messages-container">
        <div class="message-list" id="message-list">
            <!-- Messages will be loaded here -->
        </div>
    </div>
    
    <div class="chat-input">
        <textarea 
            id="message-input" 
            placeholder="Type your message..." 
            rows="3"
        ></textarea>
        <button id="send-button" class="btn btn-primary">Send</button>
    </div>
    
    <!-- Hidden input to store agent ID -->
    <input type="hidden" id="agent-id" value="{{ agent_id }}">
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Any page-specific JavaScript can go here
</script>
{% endblock %}
