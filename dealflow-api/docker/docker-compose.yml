version: '3.12'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
      - client-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/dealflow.db
      - SECRET_KEY=${SECRET_KEY:-dealflow-secret-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=true
    restart: unless-stopped

volumes:
  client-data: