retrieve_projects_task:
  description: >
    Retrieve all available SEO projects from the Advanced Web Ranking account.
    Get comprehensive project information including project names, IDs, tracking 
    frequencies, keyword counts, and main website URLs.
    
    Use the AWR Projects tool to fetch this data. Structure the information clearly.
  expected_output: >
    A structured list of all AWR projects with names, IDs, frequencies, keyword counts, 
    and websites. Clean JSON or structured text format.
  agent: awr_data_specialist

present_options_task:
  description: >
    Present the retrieved projects to the user in a clear, easy-to-scan format.
    
    DO NOT delegate this task. You already have all the project data from the 
    previous task context. Work directly with that data.
    
    Format your presentation as:
    1. Summary: "I found [X] projects in your AWR account."
    2. Top 10 projects by keyword count (ranked list with IDs)
    
    Then ask: "Which project would you like me to analyze? Please provide the project name or ID."
    
    DO NOT ask about analysis preferences or time frames yet - just get the project selection.
    Wait for the user to respond with their project choice before proceeding.
  expected_output: >
    A clear presentation of projects with a simple question asking which project to analyze.
    Output should be the selected project name/ID from the user.
  agent: seo_strategy_analyst
  human_input: true

fetch_detailed_data_task:
  description: >
    IMMEDIATELY fetch ALL available data from AWR APIs for the selected project.
    NO QUESTIONS - just collect everything automatically!
    
    You MUST use ALL these tools systematically:
    
    1. Get AWR Project Details - Get project configuration
    2. Get AWR Project Update Dates - See historical dates
    3. Get AWR Keyword Rankings - Get ranking positions (use days=90 for 90 days of data)
    4. Get AWR Keyword Difficulty - Get competitiveness scores
    5. Get AWR Search Volume Data - Get monthly search volumes
    
    Use the project name from the previous task context. For tools that need project_id,
    extract it from the project details.
    
    IMPORTANT: Do this automatically without asking the user anything. Just fetch all the data.
    If an API call fails, note it and continue with other tools - don't stop the process.
    
    Store collected data summary in memory for future reference.
  expected_output: >
    Complete dataset including:
    - Project details and configuration
    - Historical update dates
    - Keyword ranking data (90 days)
    - Keyword difficulty scores
    - Search volume data
    - Summary of what was successfully collected and any errors encountered
    
    Structured as JSON or clear text format ready for analysis.
  agent: awr_data_specialist
  context:
    - present_options_task

gather_preferences_task:
  description: >
    NOW that all data has been collected, ask the user what type of analysis they want.
    
    Present these analysis options clearly:
    1. Ranking trends and performance over time
    2. Keyword opportunities (based on difficulty and search volume)
    3. Comprehensive SEO audit with all data
    4. Custom analysis (let them specify what they need)
    
    Ask: "I've collected all the data for [PROJECT NAME]. What would you like me to focus on in my analysis?"
    
    Wait for their response before proceeding.
  expected_output: >
    User's analysis preferences clearly documented. What aspects of the data they want analyzed.
  agent: seo_strategy_analyst
  human_input: true
  context:
    - fetch_detailed_data_task

analyze_rankings_task:
  description: >
    Analyze the keyword ranking data to identify trends, patterns, and insights.
    
    Focus on:
    1. Overall ranking trends (improving, declining, stable)
    2. Top performing keywords (highest rankings)
    3. Keywords with biggest improvements
    4. Keywords with biggest declines
    5. Ranking volatility and stability
    6. Search engine specific patterns
    
    Look for actionable insights that would help improve SEO strategy.
    
    Save your analysis findings to memory.
  expected_output: >
    Comprehensive ranking analysis with:
    - Summary of overall ranking trends
    - List of top performers and opportunities
    - Identification of problem areas
    - Specific insights about ranking changes
    - Recommendations based on ranking data
  agent: seo_strategy_analyst
  context:
    - fetch_detailed_data_task

analyze_opportunities_task:
  description: >
    Identify keyword opportunities by combining difficulty scores and search volume data.
    
    Find:
    1. Low-difficulty, high-volume keywords (quick wins)
    2. Medium-difficulty keywords with good volume (growth opportunities)
    3. High-volume keywords worth targeting despite difficulty
    4. Keywords with declining difficulty (emerging opportunities)
    
    Prioritize keywords that offer the best ROI potential.
    
    Save opportunity findings to memory for future reference.
  expected_output: >
    Prioritized list of keyword opportunities with:
    - Quick wins (easy targets with good traffic potential)
    - Growth opportunities (medium difficulty, good volume)
    - Strategic targets (hard but valuable)
    - Justification for each recommendation
    - Expected difficulty and traffic potential
  agent: seo_strategy_analyst
  context:
    - fetch_detailed_data_task

generate_analysis_report_task:
  description: >
    Create a comprehensive, professional SEO analysis report that addresses the user's 
    specific questions and preferences.
    
    Structure the report with:
    
    ## Executive Summary
    Key findings and recommendations in 3-4 bullet points. What matters most?
    
    ## Project Overview
    Basic project details, tracking setup, data range analyzed
    
    ## Ranking Performance Analysis
    Insights from ranking trends, top performers, areas of concern
    
    ## Keyword Opportunities
    Prioritized recommendations based on difficulty and volume analysis
    
    ## Detailed Findings
    Based on user's specific focus areas from their preferences
    
    ## Strategic Recommendations
    1. Immediate actions (this week)
    2. Short-term initiatives (this month)
    3. Long-term strategy (this quarter)
    
    ## Next Steps
    Clear action items the user can take based on this analysis.
    
    Make it professional, actionable, and easy to understand. Use data to support 
    every recommendation.
    
    Save the full report to memory for future reference and comparison.
  expected_output: >
    A comprehensive markdown-formatted SEO analysis report with:
    - Executive summary with key findings
    - Detailed project overview with all metrics
    - Ranking performance analysis
    - Keyword opportunity analysis
    - Analysis based on user's focus areas
    - Specific, actionable recommendations with priorities
    - Clear next steps
  agent: seo_strategy_analyst
  context:
    - fetch_detailed_data_task
    - analyze_rankings_task
    - analyze_opportunities_task
    - gather_preferences_task