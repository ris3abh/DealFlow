retrieve_projects_task:
  description: >
    Retrieve all available SEO projects from the Advanced Web Ranking account.
    Use the AWR Projects tool to fetch this data.
    
    CRITICAL: The tool will return a SUMMARY with statistics, not raw project lists.
    You will receive: total count, top 10 projects, averages.
    Raw data is automatically stored in files - you don't see it.
  expected_output: >
    A concise summary containing:
    - Total number of projects
    - Top 10 projects by keyword count (name, ID, keyword count only)
    - Average keywords per project
    
    Format as a brief numbered list. Maximum 200 tokens.
  agent: awr_data_specialist

present_options_task:
  description: >
    Present the project summary to the user in a clear, scannable format.
    
    CRITICAL: DO NOT use ANY tools. DO NOT try to analyze anything.
    You are ONLY presenting the list and collecting the user's selection.
    
    Work with the summary data from the previous task context.
    
    Format your presentation as:
    1. One-line summary: "Found [X] projects in your AWR account."
    2. Top 10 projects as a simple numbered list (name and keyword count only)
    3. Ask: "Which project would you like me to analyze? (Provide name or ID)"
    
    When the user responds with a project name or ID, your ONLY job is to 
    output that selection. Do NOT try to query metadata, do NOT try to analyze.
    Data collection happens in the NEXT task.
    
    Wait for user response.
  expected_output: >
    If presenting: Simple numbered list with question.
    If user responded: ONLY output the selected project name exactly as provided.
    
    Example: "CHCP" or "pella.com"
    
    DO NOT add analysis, DO NOT use tools, DO NOT add context.
    Just the project name. Maximum 10 tokens.
  agent: seo_strategy_analyst
  human_input: true

fetch_detailed_data_task:
  description: >
    Fetch ALL AWR data for the selected project AUTOMATICALLY.
    NO questions, NO waiting - just collect everything immediately.
    
    CRITICAL INSTRUCTIONS:
    
    1. Use ALL these tools in sequence:
       - Get AWR Project Details
       - Get AWR Project Update Dates
       - Get AWR Keyword Rankings (days=90)
       - Get AWR Keyword Difficulty (needs project + project_id from details)
       - Get AWR Search Volume Data (needs project_id from details)
    
    2. Each tool returns COMPACT STATISTICS ONLY:
       - You will NOT see raw keyword lists
       - You will get: counts, averages, distributions, file paths
       - Raw data is stored automatically in knowledge/api_data/
    
    3. Extract project_id from the details response
    
    4. If any tool fails, note it and continue with others
    
    5. After all tools complete, report the collection status
    
    DO NOT ask the user anything. DO NOT wait. Just execute all tools.
  expected_output: >
    Data collection status report with ONLY these elements:
    
    ✅ Project Details: [project_id], [frequency], [keyword_count] keywords
    ✅ Rankings: [total_rankings] records, avg position [X], [Y] in top 10
    ✅ Difficulty: avg [X]/100, [Y] easy opportunities
    ✅ Volume: [total_volume] monthly searches
    ✅ Metadata: knowledge/api_data/[project]_metadata.json
    
    Format as a brief status checklist. Maximum 300 tokens.
    
    DO NOT include: keyword lists, raw data, detailed breakdowns.
    ONLY include: summary statistics and file paths.
  agent: awr_data_specialist
  context:
    - present_options_task

gather_preferences_task:
  description: >
    Data collection is complete. Ask what analysis the user wants.
    
    Present these options clearly:
    1. Ranking trends and performance analysis
    2. Keyword opportunity identification (low difficulty + high volume)
    3. Comprehensive SEO audit
    4. Custom analysis (user specifies)
    
    Ask: "I've collected all data for [PROJECT]. What would you like me to analyze?"
    
    Keep it brief. Wait for their response.
  expected_output: >
    User's analysis preference clearly stated.
    Maximum 50 tokens. Just the choice, no elaboration.
  agent: seo_strategy_analyst
  human_input: true
  context:
    - fetch_detailed_data_task

analyze_rankings_task:
  description: >
    Analyze ranking performance using the STORED data files.
    
    CRITICAL: Do NOT try to analyze from task context - it only has summaries.
    
    PROCESS:
    1. Use "Query Project Metadata" tool first to see what files exist
    2. Use "Query Keywords by Position Range" for specific position segments:
       - Positions 1-3 (top performers)
       - Positions 4-10 (near top)
       - Positions 11-20 (page 2 opportunities)
    3. Analyze patterns you find
    
    Focus on:
    - Which position segments have most keywords
    - Distribution of rankings
    - Quick-win opportunities (positions 4-10)
    - Page 2 opportunities (positions 11-20)
    
    Keep analysis concise and actionable.
  expected_output: >
    Ranking analysis with specific insights:
    
    Position Distribution:
    - Top 3: [X] keywords
    - Positions 4-10: [Y] keywords (opportunity to reach top 3)
    - Page 2 (11-20): [Z] keywords (opportunity to reach page 1)
    
    Key Insights:
    - [2-3 specific, actionable observations]
    
    Maximum 400 tokens. Focus on insights, not data dumps.
  agent: seo_strategy_analyst
  context:
    - fetch_detailed_data_task

analyze_opportunities_task:
  description: >
    Identify keyword optimization opportunities using the STORED data files.
    
    CRITICAL: Query the stored files, don't use task context summaries.
    
    PROCESS:
    1. Use "Query Project Metadata" to verify data availability
    2. Use "Cross-Reference SEO Opportunities" tool with these criteria:
       - Position range: 11-50 (not on page 1 yet)
       - Max difficulty: 40 (winnable)
       - Min volume: 500 (worthwhile traffic)
    3. Analyze the opportunities returned
    
    The cross-reference tool does the heavy lifting - it combines:
    - Rankings data (positions 11-50)
    - Difficulty data (≤40)
    - Volume data (≥500 searches/month)
    
    Interpret the results and recommend priorities.
  expected_output: >
    Opportunity analysis with specific recommendations:
    
    Top Opportunities Found: [X]
    
    Priority Targets (list top 5-10):
    1. [Keyword] - Pos [X], Difficulty [Y], Volume [Z] searches/month
    2. [Keyword] - Pos [X], Difficulty [Y], Volume [Z] searches/month
    ...
    
    Strategy Recommendation:
    - [2-3 specific action items based on the opportunities]
    
    Maximum 500 tokens. Be specific and actionable.
  agent: seo_strategy_analyst
  context:
    - fetch_detailed_data_task

generate_analysis_report_task:
  description: >
    Generate a comprehensive SEO analysis report synthesizing all findings.
    
    STRUCTURE YOUR REPORT:
    
    # SEO Analysis Report: [Project Name]
    
    ## Executive Summary
    - [3-5 bullet points of key findings]
    
    ## Current Performance (from analyze_rankings_task context)
    - [Brief summary of ranking distribution]
    - [Key performance metrics]
    
    ## Opportunities Identified (from analyze_opportunities_task context)
    - [Top opportunities with specific keywords]
    - [Priority recommendations]
    
    ## Strategic Recommendations
    - [3-5 prioritized action items]
    - [Expected impact of each]
    
    ## Next Steps
    - [Specific, tactical next actions]
    
    Keep it concise, actionable, and data-driven.
    Use the insights from previous analysis tasks - don't re-query data.
  expected_output: >
    A complete SEO analysis report in markdown format.
    
    Must include:
    - Executive summary with key findings
    - Performance analysis section
    - Opportunity identification section
    - Strategic recommendations
    - Next steps
    
    Maximum 1500 tokens.
    
    CRITICAL: Use insights from previous analysis tasks.
    DO NOT query data files again - synthesize existing analysis.
  agent: seo_strategy_analyst
  markdown: true
  output_file: seo_analysis_report.md
  context:
    - fetch_detailed_data_task
    - analyze_rankings_task
    - analyze_opportunities_task
    - gather_preferences_task