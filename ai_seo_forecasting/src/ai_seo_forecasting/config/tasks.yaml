retrieve_projects_task:
  description: >
    Retrieve all available SEO projects from the Advanced Web Ranking account.
    Get comprehensive project information including project names, IDs, tracking 
    frequencies, keyword counts, and main website URLs.
    
    Use the AWR Projects tool to fetch this data. Structure the information clearly.
  expected_output: >
    A structured list of all AWR projects with names, IDs, frequencies, keyword counts, 
    and websites. Clean JSON or structured text format.
  agent: awr_data_specialist

present_options_task:
  description: >
    Present the retrieved projects to the user in a clear, easy-to-scan format.
    
    DO NOT delegate this task. You already have all the project data from the 
    previous task context. Work directly with that data.
    
    Format your presentation as:
    1. Summary: "I found [X] projects in your AWR account."
    2. Top 10 projects by keyword count (ranked list with IDs)
    3. Notable concerns (projects with low keyword counts or infrequent updates)
    4. End with: "Which project would you like me to analyze? Please provide the project name or ID."
    
    IMPORTANT: After presenting, wait for the user's response. Simply acknowledge 
    their selection and confirm it. DO NOT attempt any analysis in this task.
  expected_output: >
    A presentation of projects followed by user's project selection. 
    Output format: "User selected project: [project_name] (ID: [id])"
  agent: seo_strategy_analyst
  context:
    - retrieve_projects_task
  human_input: true

gather_preferences_task:
  description: >
    The user has selected a project in the previous task. Now ask them about 
    their analysis preferences.
    
    Ask these questions:
    1. "What time period should I analyze? (e.g., last 30 days, 60 days, 90 days, or all time)"
    2. "What should I focus on? (e.g., keyword rankings, traffic trends, or comprehensive analysis)"
    
    Keep it conversational. After they respond, confirm their preferences:
    "Perfect! I'll analyze [project] for [timeframe], focusing on [areas]. 
    Let me fetch the detailed data now."
  expected_output: >
    Confirmation of analysis preferences in format:
    "Analysis Configuration:
    - Project: [name] (ID: [id])
    - Time Period: [period]
    - Focus Areas: [areas]"
  agent: seo_strategy_analyst
  context:
    - present_options_task
  human_input: true

fetch_detailed_data_task:
  description: >
    Extract the project NAME from the previous tasks' context. 
    CRITICAL: You must use the project NAME (e.g., 'pella.com'), NOT the numeric ID.
    
    Use these AWR tools to fetch complete data:
    1. Get AWR Project Details tool - Provide the project NAME as input
    2. Get AWR Project Update Dates tool - Provide the project NAME as input
    
    Fetch ALL available data for the selected project. Be thorough.
    
    Structure the output with:
    - Project metadata (name, ID, frequency, keyword count)
    - All keywords being tracked
    - All websites being monitored
    - All search engines
    - All locations
    - Complete update history with dates
  expected_output: >
    Complete dataset including:
    1. Project details (name, ID, frequency, depth, etc.)
    2. Full list of keywords (all of them)
    3. All websites being tracked
    4. All search engines being monitored
    5. All geographic locations
    6. Complete update history with first and last update dates
    7. Date count and update frequency analysis
  agent: awr_data_specialist
  context:
    - gather_preferences_task

generate_analysis_report_task:
  description: >
    Create a comprehensive SEO analysis report based on the fetched data and 
    user preferences from previous tasks.
    
    Structure the report in markdown format:
    
    # SEO Analysis Report: [Project Name]
    
    ## Executive Summary
    - Quick overview of project scope and key findings
    - 3-5 bullet points with the most important insights
    
    ## Project Overview
    - Project name and ID
    - Tracking frequency and depth
    - Number of keywords tracked
    - Websites monitored
    - Search engines and locations covered
    - Data collection period (first to last update)
    
    ## Data Analysis
    Based on user's requested focus areas and timeframe, analyze:
    - Keyword distribution and coverage
    - Website structure and tracking scope
    - Search engine and location diversity
    - Update frequency and data consistency
    - Notable patterns or gaps in the data
    
    ## Recommendations
    1. Actionable suggestions for improving SEO tracking
    2. Opportunities for expanding keyword coverage
    3. Suggestions for tracking frequency optimization
    
    ## Next Steps
    Clear action items the user can take based on this analysis.
    
    Make it professional, actionable, and easy to understand.
  expected_output: >
    A comprehensive markdown-formatted SEO analysis report with:
    - Executive summary with key findings
    - Detailed project overview with all metrics
    - Analysis based on user's focus areas
    - Specific, actionable recommendations
    - Clear next steps
  agent: seo_strategy_analyst
  context:
    - fetch_detailed_data_task
    - gather_preferences_task